services:
  app:
    build:
      context: .
    ports:
      - "${EXTERNAL_PORT:-8080}:8080"
      - "127.0.0.1:${METRICS_PORT:-9090}:9090"
    environment:
      - PORT=8080
      - METRICS_PORT=9090
      - ENV=production
      - GOMEMLIMIT=${GOMEMLIMIT:-3GiB}
      - PPROF_ENABLED=${PPROF_ENABLED:-false}
      - RETRY_MAX_ATTEMPTS=${RETRY_MAX_ATTEMPTS:-3}
      - GATEWAY_API_KEY=${GATEWAY_API_KEY}
      - RATE_LIMIT_PER_IP=${RATE_LIMIT_PER_IP:-100}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-60000}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - REDIS_URL=redis://redis:6379
      - REDIS_KEY_PREFIX=llm_gateway
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - KILO_API_KEY=${KILO_API_KEY}
      - OPENCODE_ZEN_API_KEY=${OPENCODE_ZEN_API_KEY}
      - ZAI_API_KEY=${ZAI_API_KEY}
      - COHERE_API_KEY=${COHERE_API_KEY}
      - NOUS_API_KEY=${NOUS_API_KEY}
      - OCI_API_KEY=${OCI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - BAI_API_KEY=${BAI_API_KEY}
      - INFERX_API_KEY=${INFERX_API_KEY}
      - GMI_API_KEY=${GMI_API_KEY}
      - ORCAROUTER_API_KEY=${ORCAROUTER_API_KEY}
      - AI_GATEWAY_API_KEY=${AI_GATEWAY_API_KEY}
      - EMPERO_API_KEY=${EMPERO_API_KEY:-free}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: ${GATEWAY_MEMORY_LIMIT:-4g}
    cpus: ${GATEWAY_CPUS:-1.5}
    pids_limit: ${GATEWAY_PIDS_LIMIT:-512}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8080/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    # noeviction: quota counters, cooldowns and circuit state must never be
    # silently evicted — allkeys-lru wiped Gemini daily counters and let the
    # gateway hammer exhausted providers. Bump memory instead of evicting.
    command: redis-server --save 60 1 --maxmemory 512mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
